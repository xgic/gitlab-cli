name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install core + package
        run: |
          python -m pip install --upgrade pip
          pip install "xgic-cli>=0.2.1"
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests

      - name: Pytest
        run: pytest -q

  package-smoke:
    name: Package smoke (uv build + clean install)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"

      - name: Build sdist and wheel
        run: uv build

      - name: Clean-env install (PyPI core + local wheel)
        run: |
          uv venv .venv-smoke
          source .venv-smoke/bin/activate
          uv pip install --upgrade pip
          uv pip install "xgic-cli>=0.2.1"
          uv pip install dist/*.whl
          xgic --version
          xgic gitlab --help
          xgic gitlab info
          python -c "from xgic.cli import __version__; from xgic.cli.gitlab import __version__ as gv; print(__version__, gv)"
